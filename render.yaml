services:
  - type: web
    name: hermes-render-online
    runtime: docker
    plan: free
    disk:
      name: hermes-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HERMES_MODE
        value: online
      - key: PORT
        value: 10000
      - key: HERMES_PASSWORD
        sync: false
        description: Password required to access your Hermes chat interface.
      - key: OPENAI_API_KEY
        sync: false
        description: OpenAI API Key (or Ollama Cloud / OpenRouter key).
      - key: OPENAI_BASE_URL
        sync: false
        description: Base URL for OpenAI-compatible API (Ollama Cloud, OpenRouter, etc.). Leave empty for OpenAI, or use https://ollama.com/v1 for Ollama Cloud, or https://openrouter.ai/api/v1 for OpenRouter.
      - key: HERMES_MODEL
        sync: false
        description: Model to use (glm-5.1 for Ollama, or openrouter/quen-2.5-72b, gpt-4o-mini, etc.).
      - key: SECRET_KEY
        generateValue: true
        description: A secret key used by Flask to secure user session cookies (automatically generated).
