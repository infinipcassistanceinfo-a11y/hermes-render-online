services:
  - type: web
    name: hermes-render-online
    runtime: docker
    plan: free
    envVars:
      - key: HERMES_MODE
        value: online
      - key: PORT
        value: 10000
      - key: HERMES_PASSWORD
        sync: false
        description: Password required to access your Hermes chat interface.
      - key: OPENAI_API_KEY
        sync: false
        description: OpenAI API Key (or Ollama Cloud / OpenRouter key).
      - key: OPENAI_BASE_URL
        value: https://ollama.com/v1
        description: Base URL for OpenAI-compatible API (Ollama Cloud, OpenRouter, etc.).
      - key: HERMES_MODEL
        value: llama3.1
        description: Model to use (llama3.1, gpt-4o-mini, etc.).
      - key: SECRET_KEY
        generateValue: true
        description: A secret key used by Flask to secure user session cookies (automatically generated).
